<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>근무시간 계산기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 상단 바는 설정 화면에서만 보인다. 메인 화면은 요약 띠 오른쪽 ⚙로 설정을 연다 -->
  <header class="topbar" id="topbar" hidden>
    <button type="button" class="icon-btn" id="settings-back" aria-label="뒤로">←</button>
    <h1>설정</h1>
  </header>

  <section class="main settings" id="settings" hidden>
    <section class="panel">
      <h2>사용자 휴일</h2>
      <form class="holiday-form" id="custom-form" novalidate>
        <div class="date-pick">
          <select id="custom-year" aria-label="연도"></select>
          <select id="custom-month" aria-label="월"></select>
          <select id="custom-day" aria-label="일"></select>
          <label class="cal-btn" title="달력에서 고르기">📅<input type="date" id="custom-date" aria-label="달력에서 날짜 고르기"></label>
        </div>
        <input type="text" id="custom-name" placeholder="이름 (예: 창립기념일)" aria-label="이름">
        <button type="submit" class="primary">추가</button>
      </form>
      <small class="error" id="custom-error"></small>
      <ul class="list" id="custom-list"></ul>
    </section>

  </section>

  <main class="main" id="home">
    <!-- 한 화면: 요약 띠(월 제목·⚙ / 필수·근무일수 한 줄 / 5칸) / 달력(남는 높이를 채움) / 입력 시트 -->
    <section class="summary" id="summary" aria-live="polite">
      <div class="summary-head">
        <h2 id="month-title"></h2>
        <button type="button" class="icon-btn" id="settings-open" aria-label="설정" title="설정">⚙</button>
      </div>
      <p class="summary-days" id="sum-days"></p>
      <dl class="summary-grid">
        <div><dt>현재</dt><dd id="sum-current"></dd></div>
        <div><dt>예상</dt><dd id="sum-overtime"></dd></div>
        <div><dt>남은 근무일</dt><dd id="sum-remaining"></dd></div>
        <div><dt>남은 입력일</dt><dd id="sum-open"></dd></div>
        <div><dt id="sum-average-label">하루 평균</dt><dd id="sum-average"></dd></div>
      </dl>
    </section>

    <div class="weekdays" aria-hidden="true">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div class="calendar" id="calendar"></div>

    <!-- 달력 아래에 늘 두는 입력 시트: 처음엔 오늘, 달력에서 누른 근무일로 바뀐다 -->
    <section class="sheet" id="sheet">
      <p class="sheet-empty" id="sheet-empty" hidden></p>
      <form id="sheet-form" novalidate>
        <div class="sheet-pending" id="sheet-pending" hidden>
          <span>저장하지 않은 변경이 있어요</span>
          <button type="button" class="primary" id="pending-save">저장</button>
          <button type="button" id="pending-discard">버리기</button>
        </div>
        <div class="sheet-head">
          <h3 id="sheet-title"></h3>
          <div class="leave-checks">
            <label class="leave-check" id="dday-check" hidden><input type="checkbox" id="in-dday" name="leave" value="dday">D-Day</label>
            <label class="leave-check"><input type="checkbox" id="in-annual" name="leave" value="annual">연차</label>
            <button type="button" class="reset-btn" id="btn-reset" aria-label="기본값" title="기본값">↺</button>
          </div>
        </div>
        <small class="error" data-error-for="leave"></small>

        <div class="field-row">
          <label class="field">
            <span>출근시간</span>
            <input type="text" id="in-start" name="start" inputmode="numeric" enterkeyhint="next" maxlength="5" autocomplete="off" placeholder="00:00">
            <small class="error" data-error-for="start"></small>
          </label>
          <label class="field">
            <span>퇴근시간</span>
            <input type="text" id="in-end" name="end" inputmode="numeric" enterkeyhint="next" maxlength="5" autocomplete="off" placeholder="00:00">
            <small class="error" data-error-for="end"></small>
          </label>
          <label class="field">
            <span>제외시간</span>
            <input type="text" id="in-exclude" name="exclude" inputmode="numeric" enterkeyhint="done" maxlength="5" autocomplete="off" placeholder="00:00">
            <small class="error" data-error-for="exclude"></small>
          </label>
        </div>
        <small class="error" data-error-for="form"></small>

        <!-- 휴게·근무 안내 상자와 저장 버튼을 한 줄에 -->
        <div class="sheet-actions">
          <div class="sheet-hint" id="sheet-hint" hidden>
            <span class="hint-rest" id="hint-rest"></span>
            <span class="hint-work" id="hint-work"></span>
          </div>
          <!-- 두 글자를 겹쳐 두어 버튼 폭이 늘 긴 쪽(저장됨)에 맞는다 -->
          <button type="submit" class="primary save-btn" id="btn-save"><span>저장</span><span>저장됨</span></button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
